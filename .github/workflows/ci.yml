name: EnterpriseX CI/CD Pipeline

on:
  push:
    branches: [ master, main, release/* ]
  pull_request:
    branches: [ master, main ]

jobs:
  code-quality-and-lint:
    name: Code Quality & Governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify CODEOWNERS Presence
        run: test -f .github/CODEOWNERS
      - name: Verify Environment Example
        run: test -f .env.example

  backend-tests:
    name: Backend API & Workflow Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci || npm install
      - name: Generate Prisma Client
        working-directory: ./backend
        run: npx prisma generate
      - name: Run Prisma Schema Validation
        working-directory: ./backend
        run: npx prisma validate
      - name: Run Automated Backend Tests
        working-directory: ./backend
        run: npm test

  python-finance-tests:
    name: Python Finance & Reporting Engine Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python Dependencies
        working-directory: ./python-service
        run: |
          pip install -r requirements.txt
      - name: Run Pytest Suite
        working-directory: ./python-service
        run: |
          pytest tests/ -v

  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci || npm install
      - name: Run Next.js Build
        working-directory: ./frontend
        run: npm run build
