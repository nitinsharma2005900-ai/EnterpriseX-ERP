version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: enterprisex-postgres
    restart: always
    environment:
      POSTGRES_USER: enterprisex_admin
      POSTGRES_PASSWORD: SecureEnterpriseX2026!
      POSTGRES_DB: enterprisex_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enterprisex_admin -d enterprisex_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - enterprisex-network

  redis:
    image: redis:7-alpine
    container_name: enterprisex-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - enterprisex-network

  backend:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: enterprisex-backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://enterprisex_admin:SecureEnterpriseX2026!@postgres:5432/enterprisex_db?schema=public
      PYTHON_SERVICE_URL: http://python-service:8000
      REDIS_URL: redis://redis:6379
      JWT_SECRET: enterprisex_super_secret_jwt_key_production_32chars!
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - enterprisex-network

  python-service:
    build:
      context: ../python-service
      dockerfile: ../docker/Dockerfile.python
    container_name: enterprisex-python
    restart: always
    ports:
      - "8000:8000"
    networks:
      - enterprisex-network

  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: enterprisex-frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - enterprisex-network

volumes:
  postgres_data:
  redis_data:

networks:
  enterprisex-network:
    driver: bridge
