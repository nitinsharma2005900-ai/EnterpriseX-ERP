services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-enterprisex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-enterprisex}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [private]
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, 'yes', --maxmemory-policy, noeviction]
    volumes: [redis_data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [private]
  python-service:
    build:
      context: ../python-service
      dockerfile: ../docker/Dockerfile.python
    environment:
      SERVICE_TOKEN: ${SERVICE_TOKEN:?Set SERVICE_TOKEN}
    networks: [private]
  backend:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-enterprisex}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-enterprisex}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET}
      SERVICE_TOKEN: ${SERVICE_TOKEN:?Set SERVICE_TOKEN}
      FRONTEND_URL: http://localhost:3000
      PYTHON_SERVICE_URL: http://python-service:8000
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      python-service: {condition: service_healthy}
    networks: [private]
  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/Dockerfile.frontend
      args: {API_URL: 'http://backend:5000'}
    ports: ['3000:3000']
    depends_on:
      backend: {condition: service_healthy}
    networks: [private]
volumes:
  postgres_data:
  redis_data:
networks:
  private: {driver: bridge}
